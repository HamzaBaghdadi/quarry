name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

env:
  WAILS_VERSION: v2.17.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./internal/...
      - run: go test ./internal/...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            target: windows
          - os: macos-latest
            platform: darwin/universal
            target: macos
          - os: ubuntu-24.04
            platform: linux/amd64
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dev.${GITHUB_SHA::7}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # Stamp the version into Windows file info and the macOS Info.plist.
          sed -i.bak -E "s/\"productVersion\": \"[^\"]*\"/\"productVersion\": \"${V%%-*}\"/" wails.json && rm wails.json.bak

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Linux dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-common file desktop-file-utils

      - name: NSIS (Windows installer)
        if: matrix.target == 'windows'
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

      - run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build
        run: |
          EXTRA=""
          # Per-user installer (no admin prompt) so in-app updates can replace the exe.
          if [[ "${{ matrix.target }}" == "windows" ]]; then EXTRA="-nsis -installscope user"; fi
          # WebKitGTK 4.1: what current Ubuntu, Debian and Fedora ship.
          if [[ "${{ matrix.target }}" == "linux" ]]; then EXTRA="-tags webkit2_41"; fi
          wails build -clean -platform ${{ matrix.platform }} $EXTRA -ldflags "-X main.version=${{ steps.v.outputs.version }}"
          ls -la build/bin

      - name: Package
        run: |
          mkdir -p dist
          case "${{ matrix.target }}" in
            windows)
              cp build/bin/quarry.exe dist/quarry-windows-amd64.exe
              cp build/bin/*installer*.exe dist/quarry-windows-amd64-installer.exe
              ;;
            macos)
              APP=$(ls -d build/bin/*.app | head -1)
              # Ad-hoc sign so Apple Silicon will run the universal binary.
              codesign --force --deep --sign - "$APP"
              ditto -c -k --keepParent "$APP" dist/Quarry-macos-universal.zip
              BIN=$(ls "$APP"/Contents/MacOS/ | head -1)
              cp "$APP/Contents/MacOS/$BIN" dist/quarry-darwin-universal
              ;;
            linux)
              cp build/bin/quarry dist/quarry-linux-amd64
              mkdir -p pkg/quarry
              cp build/bin/quarry pkg/quarry/
              cp build/linux/icons/quarry-256.png pkg/quarry/quarry.png
              cp build/linux/quarry.desktop pkg/quarry/
              tar -C pkg -czf dist/quarry-linux-amd64.tar.gz quarry
              # .deb / .rpm: the package manager installs GTK + WebKitGTK.
              go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
              export VERSION="${{ steps.v.outputs.version }}"
              nfpm package --config build/linux/nfpm.yaml --packager deb --target dist/quarry-linux-amd64.deb
              nfpm package --config build/linux/nfpm.yaml --packager rpm --target dist/quarry-linux-amd64.rpm
              # AppImage with WebKitGTK bundled: runs without installing anything.
              bash build/linux/appimage.sh dist/quarry-linux-amd64.AppImage
              ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: quarry-${{ matrix.target }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history for the release notes
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt
      - name: Release notes
        run: |
          bash .github/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
