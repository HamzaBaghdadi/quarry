# .deb / .rpm packaging (https://nfpm.goreleaser.com).
# The package manager installs GTK and WebKitGTK automatically.
name: quarry
arch: amd64
platform: linux
version: ${VERSION}
version_schema: semver
section: database
priority: optional
maintainer: Quarry <quarry@users.noreply.github.com>
vendor: Quarry
description: |
  A small, fast desktop client for every database.
  PostgreSQL, MySQL, MariaDB, SQLite, SQL Server, ClickHouse,
  CockroachDB, TiDB, MongoDB, Redis and Valkey in one app.
homepage: https://github.com/HamzaBaghdadi/quarry
license: Apache-2.0

contents:
  - src: ./build/bin/quarry
    dst: /usr/bin/quarry
    file_info:
      mode: 0755
  - src: ./build/linux/quarry.desktop
    dst: /usr/share/applications/quarry.desktop
  - src: ./build/linux/icons/quarry-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/quarry.png
  - src: ./build/linux/icons/quarry-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/quarry.png

overrides:
  deb:
    depends:
      - libgtk-3-0t64 | libgtk-3-0
      - libwebkit2gtk-4.1-0
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
